<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B4F8A"><link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
<title>Simulador de slicer · U04 · Tecnología 4º ESO</title>
<meta name="description" content="Cambia altura de capa, relleno y soportes y observa el efecto.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/common.css"><link rel="stylesheet" href="../../../assets/css/unidad.css">
<style>
.sl-wrap{max-width:900px;margin:30px auto;padding:0 20px 60px}
.sl-hero{text-align:center;margin-bottom:22px}
.sl-hero h1{font-family:var(--cond);font-size:2rem;color:var(--principal);margin:0 0 8px}
.sl-card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.sl-card h3{font-family:var(--cond);color:var(--principal);font-size:1.05rem;margin:0 0 10px}
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.sl-grid{grid-template-columns:1fr}}
.sl-controles{display:flex;flex-direction:column;gap:14px}
.sl-control label{font-family:var(--cond);font-size:.82rem;color:var(--texto2);display:block;margin-bottom:4px}
.sl-control input[type=range]{width:100%;accent-color:var(--principal)}
.sl-control .val{font-family:'JetBrains Mono',monospace;color:var(--principal);font-weight:600;font-size:.95rem}
.sl-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sl-tab{font-family:var(--cond);background:#fff;border:1.5px solid var(--borde);padding:8px 12px;border-radius:14px;cursor:pointer;font-size:.85rem}
.sl-tab.activa{background:var(--principal);color:#fff;border-color:var(--principal)}
.sl-vis{background:#FAFBFC;border-radius:10px;padding:14px;display:flex;justify-content:center;align-items:center;min-height:240px}
.sl-resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.sl-r{background:var(--principal-cl);border-left:3px solid var(--principal);padding:10px 14px;border-radius:0 8px 8px 0}
.sl-r .lab{font-family:var(--cond);font-size:.7rem;color:var(--principal);text-transform:uppercase;letter-spacing:1px}
.sl-r .val{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:var(--texto);font-weight:600;display:block;margin-top:2px}
.sl-interpret{margin-top:14px;padding:12px 16px;background:#E6F1FB;border-left:4px solid #378ADD;border-radius:0 6px 6px 0;font-size:.92rem;line-height:1.55}
</style></head>
<body>
<header class="curso-hd"><span class="curso-sb">U04 · Impresión 3D · Slicer</span></header>
<nav class="curso-navcross" role="navigation">
  <a href="../../../index.html"><span>🏠</span><span class="nc-lbl">Índice</span></a><span class="nc-sep">·</span>
  <a href="../index.html"><span>📋</span><span class="nc-lbl">Hub U04</span></a><span class="nc-sep">·</span>
  <a href="../libro-digital.html"><span>📖</span><span class="nc-lbl">Libro</span></a><span class="nc-sep">·</span>
  <span class="nc-current"><span>🔪</span><span class="nc-lbl">Slicer</span></span>
</nav>

<main id="main-content" class="sl-wrap">
  <section class="sl-hero"><h1>🔪 Simulador de slicer</h1><p>Cambia los parámetros y observa cómo se "lamina" la pieza, el tiempo y el material.</p></section>

  <div class="sl-card">
    <div class="sl-tabs">
      <span style="font-family:var(--cond);font-size:.82rem;color:var(--texto2);align-self:center;margin-right:6px">Modelo:</span>
      <button class="sl-tab activa" data-m="cubo">Cubo 4 cm</button>
      <button class="sl-tab" data-m="copa">Copa</button>
      <button class="sl-tab" data-m="figura">Figura voladiza</button>
    </div>

    <div class="sl-grid">
      <div class="sl-controles">
        <div class="sl-control">
          <label>Altura de capa <span class="val" id="v-capa">0,2 mm</span></label>
          <input type="range" id="capa" min="1" max="3" step="1" value="2">
          <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--texto2);font-family:var(--cond)"><span>0,1 (fina)</span><span>0,2 (media)</span><span>0,3 (rápida)</span></div>
        </div>
        <div class="sl-control">
          <label>Relleno (infill) <span class="val" id="v-rel">25 %</span></label>
          <input type="range" id="rel" min="0" max="100" step="5" value="25">
        </div>
        <div class="sl-control">
          <label>Patrón <span class="val" id="v-pat">Giroide</span></label>
          <select id="pat" style="font-family:'JetBrains Mono',monospace;padding:6px;border:1.5px solid var(--borde);border-radius:6px;width:100%">
            <option value="rejilla">Rejilla (grid)</option>
            <option value="giroide" selected>Giroide</option>
            <option value="lineas">Líneas</option>
            <option value="concentrico">Concéntrico</option>
          </select>
        </div>
        <div class="sl-control">
          <label><input type="checkbox" id="soportes"> Soportes activos</label>
        </div>
        <div class="sl-control">
          <label><input type="checkbox" id="brim"> Brim (mejor adhesión)</label>
        </div>
      </div>

      <div class="sl-vis">
        <svg viewBox="0 0 240 240" id="vis" style="width:100%;max-width:280px;height:auto">
          <!-- contenido generado por JS -->
        </svg>
      </div>
    </div>

    <div class="sl-resumen">
      <div class="sl-r"><span class="lab">Tiempo</span><span class="val" id="r-t">—</span></div>
      <div class="sl-r"><span class="lab">Material (g)</span><span class="val" id="r-m">—</span></div>
      <div class="sl-r"><span class="lab">Coste (€)</span><span class="val" id="r-c">—</span></div>
      <div class="sl-r"><span class="lab">Capas</span><span class="val" id="r-n">—</span></div>
    </div>

    <div class="sl-interpret" id="interp">📌 Modifica parámetros para ver el análisis.</div>
  </div>
</main>

<script>
(function(){'use strict';
var modelo='cubo',pat='giroide';
var alturas=[0.1,0.2,0.3];
var modelos={
  cubo:{alto:40,vol:64,tiempoBase:3.5},
  copa:{alto:80,vol:48,tiempoBase:5},
  figura:{alto:60,vol:30,tiempoBase:3,necesitaSoportes:true}
};

document.querySelectorAll('.sl-tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.sl-tab').forEach(function(t){t.classList.remove('activa');});
    b.classList.add('activa');modelo=b.dataset.m;recalc();
  });
});
['capa','rel','soportes','brim'].forEach(function(id){
  document.getElementById(id).addEventListener('input',recalc);
  document.getElementById(id).addEventListener('change',recalc);
});
document.getElementById('pat').addEventListener('change',function(e){pat=e.target.value;document.getElementById('v-pat').textContent=e.target.options[e.target.selectedIndex].text.split(' ')[0];recalc();});

function recalc(){
  var ic=parseInt(document.getElementById('capa').value);
  var capa=alturas[ic-1];
  document.getElementById('v-capa').textContent=capa.toFixed(2).replace('.',',')+' mm';
  var rel=parseInt(document.getElementById('rel').value);
  document.getElementById('v-rel').textContent=rel+' %';
  var sopOn=document.getElementById('soportes').checked;
  var brOn=document.getElementById('brim').checked;
  var m=modelos[modelo];
  var capas=Math.ceil(m.alto/capa);
  // Tiempo: base × factor capa × factor relleno
  var factorCapa=capa===0.1?2.0:capa===0.2?1.0:0.7;
  var factorRel=0.6+(rel/100)*0.6; // 0,6 a 1,2
  var factorSop=sopOn?1.3:1;
  var factorBr=brOn?1.05:1;
  var horas=m.tiempoBase*factorCapa*factorRel*factorSop*factorBr;
  // Material: paredes ~30% + relleno × volumen interior
  var vol=m.vol; // cm³
  var gramos=vol*1.25*(0.3+0.7*rel/100);
  if(sopOn)gramos*=1.25;
  if(brOn)gramos*=1.03;
  var coste=gramos*0.05; // 50 €/kg ≈ 0,05 €/g
  document.getElementById('r-t').textContent=horas.toFixed(1)+' h';
  document.getElementById('r-m').textContent=gramos.toFixed(0)+' g';
  document.getElementById('r-c').textContent=coste.toFixed(2)+' €';
  document.getElementById('r-n').textContent=capas;

  // Análisis
  var msg='';
  if(capa===0.1){msg+='Capa fina: <strong>excelente acabado</strong>, pero el doble de tiempo. ';}
  else if(capa===0.3){msg+='Capa gruesa: <strong>rápido</strong>, pero capas visibles. ';}
  else {msg+='Capa estándar: buen equilibrio calidad/tiempo. ';}
  if(rel<10){msg+='Relleno muy bajo: <strong>pieza frágil</strong>. ';}
  else if(rel>60){msg+='Relleno alto: <strong>mucho material y tiempo</strong>, solo si la pieza recibe carga importante. ';}
  if(m.necesitaSoportes && !sopOn){msg+='⚠️ Esta pieza tiene voladizos: <strong>los soportes son recomendables</strong> para que las capas voladas no se caigan. ';}
  if(!m.necesitaSoportes && sopOn){msg+='ℹ️ Esta pieza no necesita soportes; los activos solo añaden tiempo y material.';}
  document.getElementById('interp').innerHTML='📌 '+msg;
  dibujar(capa,rel,sopOn,brOn);
}

function dibujar(capa,rel,sopOn,brOn){
  var svg=document.getElementById('vis');
  svg.innerHTML='';
  var ns='http://www.w3.org/2000/svg';
  // base
  if(brOn){
    var br=document.createElementNS(ns,'rect');
    br.setAttribute('x',40);br.setAttribute('y',200);br.setAttribute('width',160);br.setAttribute('height',6);
    br.setAttribute('fill','#9BC3E5');svg.appendChild(br);
  }
  // pieza según modelo (representación simplificada)
  if(modelo==='cubo'){
    // capas horizontales
    var n=Math.min(20,Math.round(15/capa*0.2));
    var altoPx=140/n;
    for(var i=0;i<n;i++){
      var r=document.createElementNS(ns,'rect');
      r.setAttribute('x',70);r.setAttribute('y',60+i*altoPx);r.setAttribute('width',100);r.setAttribute('height',altoPx-0.5);
      r.setAttribute('fill',i%2===0?'#3a7fb8':'#5BA0D5');svg.appendChild(r);
    }
    // relleno (líneas internas)
    var nl=Math.max(2,Math.round(rel/10));
    for(var k=0;k<nl;k++){
      var l=document.createElementNS(ns,'line');
      l.setAttribute('x1',75+k*(90/nl));l.setAttribute('y1',65);
      l.setAttribute('x2',75+k*(90/nl));l.setAttribute('y2',195);
      l.setAttribute('stroke','rgba(27,79,138,0.4)');l.setAttribute('stroke-width','1');
      svg.appendChild(l);
    }
  } else if(modelo==='copa'){
    // copa: trapecio + columna
    var pol=document.createElementNS(ns,'polygon');
    pol.setAttribute('points','90,60 150,60 170,170 70,170');
    pol.setAttribute('fill','#5BA0D5');pol.setAttribute('stroke','#3a7fb8');pol.setAttribute('stroke-width','2');
    svg.appendChild(pol);
    var ba=document.createElementNS(ns,'rect');
    ba.setAttribute('x',100);ba.setAttribute('y',170);ba.setAttribute('width',40);ba.setAttribute('height',10);
    ba.setAttribute('fill','#3a7fb8');svg.appendChild(ba);
    var bs=document.createElementNS(ns,'rect');
    bs.setAttribute('x',80);bs.setAttribute('y',180);bs.setAttribute('width',80);bs.setAttribute('height',16);
    bs.setAttribute('fill','#3a7fb8');svg.appendChild(bs);
    // capas líneas horizontales
    for(var j=0;j<8;j++){var ly=document.createElementNS(ns,'line');
      ly.setAttribute('x1',70+j*2);ly.setAttribute('y1',70+j*15);
      ly.setAttribute('x2',170-j*2);ly.setAttribute('y2',70+j*15);
      ly.setAttribute('stroke','#fff');ly.setAttribute('stroke-width','0.5');svg.appendChild(ly);}
  } else {
    // figura con voladizo
    var c=document.createElementNS(ns,'rect');
    c.setAttribute('x',90);c.setAttribute('y',60);c.setAttribute('width',30);c.setAttribute('height',140);
    c.setAttribute('fill','#5BA0D5');c.setAttribute('stroke','#3a7fb8');c.setAttribute('stroke-width','2');svg.appendChild(c);
    var v=document.createElementNS(ns,'rect');
    v.setAttribute('x',120);v.setAttribute('y',60);v.setAttribute('width',60);v.setAttribute('height',20);
    v.setAttribute('fill','#5BA0D5');v.setAttribute('stroke','#3a7fb8');v.setAttribute('stroke-width','2');svg.appendChild(v);
    if(sopOn){
      for(var s=0;s<5;s++){var sup=document.createElementNS(ns,'line');
        sup.setAttribute('x1',125+s*11);sup.setAttribute('y1',80);
        sup.setAttribute('x2',125+s*11);sup.setAttribute('y2',200);
        sup.setAttribute('stroke','#FFA500');sup.setAttribute('stroke-width','1.5');sup.setAttribute('stroke-dasharray','3,2');
        svg.appendChild(sup);}
    }
  }
  // cama (línea inferior)
  var cama=document.createElementNS(ns,'line');
  cama.setAttribute('x1',20);cama.setAttribute('y1',200);cama.setAttribute('x2',220);cama.setAttribute('y2',200);
  cama.setAttribute('stroke','#888');cama.setAttribute('stroke-width','2');svg.appendChild(cama);
}

recalc();
})();
</script>
</body>
</html>
