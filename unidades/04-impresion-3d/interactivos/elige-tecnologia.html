<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B4F8A"><link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
<title>Elige la tecnología 3D · U04 · Tecnología 4º ESO</title>
<meta name="description" content="10 casos: identifica la tecnología 3D adecuada (FDM, SLA, SLS, metal).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/common.css"><link rel="stylesheet" href="../../../assets/css/unidad.css">
<style>
.et-wrap{max-width:880px;margin:30px auto;padding:0 20px 60px}
.et-hero{text-align:center;margin-bottom:24px}
.et-hero h1{font-family:var(--cond);font-size:2rem;color:var(--principal);margin:0 0 8px}
.et-progress{display:flex;justify-content:space-between;background:#F4F6F9;padding:10px 16px;border-radius:8px;margin-bottom:18px;font-family:var(--cond)}
.et-progress strong{color:var(--principal)}
.et-card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px;margin-bottom:20px}
.et-caso{font-size:1rem;line-height:1.55;margin:0 0 14px;padding:14px 18px;background:var(--principal-cl);border-left:4px solid var(--principal);border-radius:0 6px 6px 0}
.et-caso .pieza{display:block;font-family:var(--cond);font-size:.78rem;letter-spacing:1.5px;color:var(--principal);margin-bottom:4px;text-transform:uppercase}
.et-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:560px){.et-opts{grid-template-columns:1fr}}
.et-opt{font-family:var(--cond);background:#fff;border:2px solid var(--borde);border-radius:8px;padding:12px;cursor:pointer;font-size:.92rem;text-align:left}
.et-opt:hover:not(:disabled){border-color:var(--principal);background:var(--principal-cl)}
.et-opt.ok{background:#E1F5EE;border-color:#1E8E3E;color:#0F6E56}
.et-opt.ko{background:#FCEBEB;border-color:#C44536;color:#9A2A2A}
.et-opt:disabled{cursor:not-allowed}
.et-opt .titulo{display:block;font-weight:700}
.et-opt .desc{display:block;color:var(--texto2);font-size:.82rem;font-weight:400;margin-top:2px}
.et-opt.ok .desc,.et-opt.ko .desc{color:inherit;opacity:.85}
.et-fb{display:none;margin-top:12px;padding:14px 18px;border-radius:8px;font-size:.93rem;line-height:1.55}
.et-fb.show{display:block}
.et-fb.acierto{background:#E1F5EE;color:#0F6E56;border-left:5px solid #1E8E3E}
.et-fb.fallo{background:#FCEBEB;color:#9A2A2A;border-left:5px solid #C44536}
.et-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.et-btn{font-family:var(--cond);padding:9px 22px;border-radius:22px;cursor:pointer;border:2px solid var(--principal);background:var(--principal);color:#fff;font-weight:600}
.et-resumen{text-align:center;background:linear-gradient(180deg,var(--principal-cl),#fff);border:2px solid var(--principal);border-radius:10px;padding:28px 24px}
.et-resumen .puntos{font-family:var(--cond);font-size:2.6rem;color:var(--principal)}
</style></head>
<body>
<header class="curso-hd"><span class="curso-sb">U04 · Impresión 3D · Elige tecnología</span></header>
<nav class="curso-navcross" role="navigation">
  <a href="../../../index.html"><span>🏠</span><span class="nc-lbl">Índice</span></a><span class="nc-sep">·</span>
  <a href="../index.html"><span>📋</span><span class="nc-lbl">Hub U04</span></a><span class="nc-sep">·</span>
  <a href="../libro-digital.html"><span>📖</span><span class="nc-lbl">Libro digital</span></a><span class="nc-sep">·</span>
  <span class="nc-current"><span>⚙️</span><span class="nc-lbl">Tecnología</span></span>
</nav>

<main id="main-content" class="et-wrap">
  <section class="et-hero"><h1>⚙️ ¿Qué tecnología 3D usar?</h1><p>10 casos reales: ¿FDM, SLA, SLS o impresión metálica?</p></section>

  <div class="et-progress"><span>Caso <strong id="num">1</strong> de <strong id="tot">10</strong></span><span>Aciertos: <strong id="ac">0</strong></span></div>

  <div class="et-card" id="card">
    <div class="et-caso"><span class="pieza" id="pieza">—</span><span id="enun"></span></div>
    <div class="et-opts" id="opts"></div>
    <div class="et-fb" id="fb"></div>
    <div class="et-actions" id="acciones" style="display:none"><button class="et-btn" id="siguiente">Siguiente →</button></div>
  </div>

  <section class="et-resumen" id="resumen" style="display:none">
    <h2 style="font-family:var(--cond);color:var(--principal);margin:0 0 6px">¡Has terminado!</h2>
    <div class="puntos"><span id="r-ac">0</span> / <span id="r-tot">10</span></div>
    <p id="r-msg" style="margin:10px 0 14px;color:var(--texto2)">—</p>
    <button class="et-btn" id="rein">🔁 Volver a empezar</button>
  </section>
</main>

<script>
(function(){'use strict';
var casos=[
  {pieza:'Prototipo de una carcasa de mando',enun:'Necesitas una pieza grande de plástico funcional para probar ergonomía. Bajo coste, en 4 horas.',correcto:'fdm',explica:'FDM. Económico, rápido, bueno para prototipos funcionales medios y grandes.'},
  {pieza:'Miniatura de wargames 28 mm',enun:'Figura con detalles muy finos, expresiones faciales, armadura con bordes nítidos.',correcto:'sla',explica:'SLA (resina). Precisión 0,025 mm, capas casi invisibles, ideal para detalles.'},
  {pieza:'Tobera de cohete reutilizable',enun:'Pieza de superaleación que aguanta 3000ºC, geometría con canales de refrigeración internos.',correcto:'metal',explica:'Impresión metálica SLM. Geometrías imposibles para mecanizado convencional. Usado por SpaceX, Rocket Lab.'},
  {pieza:'Cien soportes de móvil para vender',enun:'PA12 (nylon) resistente, propiedades isótropas (resistencia igual en todas direcciones), sin postproceso de soportes.',correcto:'sls',explica:'SLS. El polvo sin sinterizar sirve de soporte. Piezas robustas, sin marcas de soportes.'},
  {pieza:'Modelo dental para férula',enun:'Reproducción exacta de la dentadura del paciente, precisión <0,1 mm, modelos rígidos.',correcto:'sla',explica:'SLA. Estándar en clínicas dentales por precisión y materiales biocompatibles disponibles.'},
  {pieza:'Pieza de repuesto para frigorífico',enun:'Pequeña pinza de plástico rota. Necesitas una sola unidad rápido y barato.',correcto:'fdm',explica:'FDM con PLA o PETG. Imprime en 1 hora a coste 0,30 €. Perfecto para reparaciones domésticas.'},
  {pieza:'Implante de cráneo a medida',enun:'Hueso del cráneo dañado. Necesitas reconstrucción biocompatible que se integre con el hueso vivo.',correcto:'metal',explica:'Impresión 3D de titanio. Biocompatible, geometría exacta del defecto extraída del TAC del paciente.'},
  {pieza:'Maqueta de un edificio para concurso',enun:'Modelo de 30×30 cm con muchos detalles arquitectónicos, no necesita resistencia mecánica.',correcto:'sla',explica:'SLA. Resina blanca premium, detalles finos, paredes finas perfectas para maquetas presentables.'},
  {pieza:'Lote de 50 carcasas industriales',enun:'Nylon, formas complejas con voladizos múltiples, propiedades mecánicas iguales en todas direcciones.',correcto:'sls',explica:'SLS. Por la cantidad y por las geometrías complejas con voladizos, donde FDM tendría problemas de soportes.'},
  {pieza:'Soporte casero para tablet',enun:'Pieza casera para la cocina, debe aguantar el peso de una tablet, no importa el acabado fino.',correcto:'fdm',explica:'FDM con PLA. La opción más barata y rápida para una sola pieza funcional doméstica.'}
];

var opciones={
  fdm:{titulo:'FDM',desc:'Filamento fundido. Económico, materiales variados.'},
  sla:{titulo:'SLA / resina',desc:'Resina UV. Precisión máxima.'},
  sls:{titulo:'SLS',desc:'Polvo de nylon. Robusta, sin soportes.'},
  metal:{titulo:'Impresión metálica',desc:'SLM. Piezas funcionales en metal.'}
};

var i=0,aciertos=0,r=false;
var n=document.getElementById('num'),tot=document.getElementById('tot'),ac=document.getElementById('ac'),pi=document.getElementById('pieza'),en=document.getElementById('enun'),op=document.getElementById('opts'),fb=document.getElementById('fb'),acc=document.getElementById('acciones'),sig=document.getElementById('siguiente'),card=document.getElementById('card'),resumen=document.getElementById('resumen');
tot.textContent=casos.length;document.getElementById('r-tot').textContent=casos.length;

function shuffle(a){var b=a.slice();for(var k=b.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=b[k];b[k]=b[j];b[j]=t;}return b;}
function pintar(){
  var c=casos[i];n.textContent=i+1;pi.textContent=c.pieza;en.innerHTML=c.enun;
  fb.className='et-fb';fb.innerHTML='';acc.style.display='none';r=false;op.innerHTML='';
  shuffle(['fdm','sla','sls','metal']).forEach(function(k){
    var o=opciones[k],b=document.createElement('button');b.className='et-opt';b.dataset.id=k;
    b.innerHTML='<span class="titulo">'+o.titulo+'</span><span class="desc">'+o.desc+'</span>';
    b.addEventListener('click',function(){if(r)return;r=true;var c2=casos[i];
      op.querySelectorAll('.et-opt').forEach(function(bt){bt.disabled=true;if(bt.dataset.id===c2.correcto)bt.classList.add('ok');else if(bt===b)bt.classList.add('ko');});
      if(k===c2.correcto){aciertos++;fb.className='et-fb show acierto';fb.innerHTML='<strong>✓ ¡Correcto!</strong> '+c2.explica;}
      else{fb.className='et-fb show fallo';fb.innerHTML='<strong>✗ Era:</strong> '+c2.explica;}
      ac.textContent=aciertos;acc.style.display='flex';
    });
    op.appendChild(b);
  });
}
sig.addEventListener('click',function(){i++;if(i>=casos.length){card.style.display='none';document.querySelector('.et-progress').style.display='none';resumen.style.display='block';document.getElementById('r-ac').textContent=aciertos;var p=Math.round(aciertos/casos.length*100);document.getElementById('r-msg').innerHTML=(p>=80?'🌟 ¡Muy bien!':p>=60?'👍 Bien.':'📚 Repasa.')+'<br><small>'+aciertos+' / '+casos.length+' ('+p+'%)</small>';resumen.scrollIntoView({behavior:'smooth'});}else pintar();});
document.getElementById('rein').addEventListener('click',function(){i=0;aciertos=0;ac.textContent='0';resumen.style.display='none';card.style.display='block';document.querySelector('.et-progress').style.display='flex';pintar();window.scrollTo({top:0,behavior:'smooth'});});
pintar();
})();
</script>
<script data-goatcounter="https://malonso72.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
