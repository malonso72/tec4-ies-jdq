<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="10 símbolos neumáticos. Identifica el componente correcto.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/common.css"><link rel="stylesheet" href="../../../assets/css/unidad.css">
<style>
.ic-wrap{max-width:880px;margin:30px auto;padding:0 20px 60px}
.ic-hero{text-align:center;margin-bottom:24px}
.ic-hero h1{font-family:var(--cond);font-size:2rem;color:var(--principal);margin:0 0 8px}
.ic-progress{display:flex;justify-content:space-between;background:#F4F6F9;padding:10px 16px;border-radius:8px;margin-bottom:18px;font-family:var(--cond)}
.ic-progress strong{color:var(--principal)}
.ic-card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px;margin-bottom:20px;text-align:center}
.ic-symbol{background:#FAFBFC;padding:20px;border-radius:10px;margin:14px 0;display:flex;justify-content:center;align-items:center;min-height:140px}
.ic-symbol svg{max-width:200px;height:auto}
.ic-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left}
@media(max-width:560px){.ic-opts{grid-template-columns:1fr}}
.ic-opt{font-family:var(--cond);background:#fff;border:2px solid var(--borde);border-radius:8px;padding:11px 14px;cursor:pointer;font-size:.92rem}
.ic-opt:hover:not(:disabled){border-color:var(--principal);background:var(--principal-cl)}
.ic-opt.ok{background:#E1F5EE;border-color:#1E8E3E;color:#0F6E56}
.ic-opt.ko{background:#FCEBEB;border-color:#C44536;color:#9A2A2A}
.ic-opt:disabled{cursor:not-allowed}
.ic-fb{display:none;margin-top:12px;padding:14px 18px;border-radius:8px;font-size:.93rem;line-height:1.55;text-align:left}
.ic-fb.show{display:block}
.ic-fb.acierto{background:#E1F5EE;color:#0F6E56;border-left:5px solid #1E8E3E}
.ic-fb.fallo{background:#FCEBEB;color:#9A2A2A;border-left:5px solid #C44536}
.ic-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.ic-btn{font-family:var(--cond);padding:9px 22px;border-radius:22px;cursor:pointer;border:2px solid var(--principal);background:var(--principal);color:#fff;font-weight:600}
.ic-resumen{text-align:center;background:linear-gradient(180deg,var(--principal-cl),#fff);border:2px solid var(--principal);border-radius:10px;padding:28px 24px}
.ic-resumen .puntos{font-family:var(--cond);font-size:2.6rem;color:var(--principal)}
</style></head>
<body>
<header class="curso-hd"><span class="curso-sb">U06 · Neumática · Identifica símbolo</span></header>
<nav class="curso-navcross" role="navigation">

<main id="main-content" class="ic-wrap">
  <section class="ic-hero"><h1>🔍 Identifica el símbolo</h1><p>10 símbolos neumáticos (ISO 1219). ¿Qué representa cada uno?</p></section>
  <div class="ic-progress"><span>Símbolo <strong id="num">1</strong> de <strong id="tot">10</strong></span><span>Aciertos: <strong id="ac">0</strong></span></div>

  <div class="ic-card" id="card">
    <div class="ic-symbol" id="symbol"></div>
    <div class="ic-opts" id="opts"></div>
    <div class="ic-fb" id="fb"></div>
    <div class="ic-actions" id="acciones" style="display:none"><button class="ic-btn" id="siguiente">Siguiente →</button></div>
  </div>

  <section class="ic-resumen" id="resumen" style="display:none">
    <h2 style="font-family:var(--cond);color:var(--principal);margin:0 0 6px">¡Has terminado!</h2>
    <div class="puntos"><span id="r-ac">0</span> / <span id="r-tot">10</span></div>
    <p id="r-msg" style="margin:10px 0 14px;color:var(--texto2)">—</p>
    <button class="ic-btn" id="rein">🔁 Volver a empezar</button>
  </section>
</main>

<script>
(function(){'use strict';
var componentes={
  cil_se:{n:'Cilindro simple efecto',exp:'Una toma de aire. Muelle hace el retorno.'},
  cil_de:{n:'Cilindro doble efecto',exp:'Dos tomas de aire. Aire empuja en ambos sentidos.'},
  v32:{n:'Válvula 3/2',exp:'3 vías, 2 posiciones. Para control de cilindro simple efecto.'},
  v52:{n:'Válvula 5/2',exp:'5 vías, 2 posiciones. Para cilindro doble efecto.'},
  compr:{n:'Compresor',exp:'Genera el aire comprimido para todo el sistema.'},
  filtro:{n:'Filtro',exp:'Elimina partículas y humedad del aire.'},
  regul:{n:'Regulador de presión',exp:'Mantiene la presión en un valor establecido.'},
  manom:{n:'Manómetro',exp:'Mide y muestra la presión del aire.'},
  fuente:{n:'Fuente de aire',exp:'Símbolo que representa el suministro general de aire.'},
  escape:{n:'Escape a atmósfera',exp:'Triángulo que indica donde el aire sale del circuito.'}
};

var simbolos={
  cil_se:'<svg viewBox="0 0 200 100"><rect x="20" y="30" width="100" height="40" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><line x1="30" y1="50" x2="100" y2="50" stroke="#1B4F8A" stroke-width="1.5"/><path d="M 100 50 L 90 45 L 90 55 Z" fill="#1B4F8A"/><line x1="40" y1="50" x2="55" y2="35" stroke="#1B4F8A" stroke-width="2"/><line x1="55" y1="35" x2="55" y2="65" stroke="#1B4F8A" stroke-width="2"/><line x1="55" y1="65" x2="40" y2="50" stroke="#1B4F8A" stroke-width="2"/><rect x="120" y="40" width="60" height="20" fill="#888"/><line x1="180" y1="50" x2="195" y2="50" stroke="#1B4F8A" stroke-width="2"/><line x1="20" y1="50" x2="10" y2="50" stroke="#1B4F8A" stroke-width="2"/><circle cx="8" cy="50" r="2" fill="#1B4F8A"/></svg>',
  cil_de:'<svg viewBox="0 0 200 100"><rect x="20" y="30" width="100" height="40" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><line x1="55" y1="30" x2="55" y2="70" stroke="#1B4F8A" stroke-width="2"/><rect x="120" y="40" width="60" height="20" fill="#888"/><line x1="180" y1="50" x2="195" y2="50" stroke="#1B4F8A" stroke-width="2"/><line x1="30" y1="30" x2="30" y2="20" stroke="#1B4F8A" stroke-width="2"/><line x1="100" y1="30" x2="100" y2="20" stroke="#1B4F8A" stroke-width="2"/><circle cx="30" cy="18" r="2" fill="#1B4F8A"/><circle cx="100" cy="18" r="2" fill="#1B4F8A"/></svg>',
  v32:'<svg viewBox="0 0 200 100"><rect x="50" y="30" width="50" height="40" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><rect x="100" y="30" width="50" height="40" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><line x1="75" y1="45" x2="75" y2="55" stroke="#1B4F8A"/><line x1="75" y1="55" x2="85" y2="50" stroke="#1B4F8A"/><path d="M 80 65 L 85 60 L 90 65" fill="none" stroke="#1B4F8A" stroke-width="1.5"/><line x1="125" y1="45" x2="125" y2="55" stroke="#1B4F8A"/><line x1="120" y1="50" x2="135" y2="50" stroke="#1B4F8A" stroke-width="2"/><polygon points="135,46 145,50 135,54" fill="#1B4F8A"/><text x="100" y="20" font-family="Barlow Condensed" font-size="13" fill="#1B4F8A" text-anchor="middle">3/2</text></svg>',
  v52:'<svg viewBox="0 0 220 100"><rect x="50" y="30" width="60" height="40" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><rect x="110" y="30" width="60" height="40" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><line x1="60" y1="45" x2="75" y2="45" stroke="#1B4F8A" stroke-width="2"/><polygon points="75,42 85,45 75,48" fill="#1B4F8A"/><line x1="100" y1="55" x2="85" y2="55" stroke="#1B4F8A" stroke-width="2"/><polygon points="85,52 75,55 85,58" fill="#1B4F8A"/><text x="140" y="22" font-family="Barlow Condensed" font-size="13" fill="#1B4F8A" text-anchor="middle">5/2</text></svg>',
  compr:'<svg viewBox="0 0 200 100"><circle cx="100" cy="50" r="30" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><polygon points="85,40 85,60 110,50" fill="#1B4F8A"/><line x1="130" y1="50" x2="170" y2="50" stroke="#1B4F8A" stroke-width="2"/><polygon points="170,45 180,50 170,55" fill="#1B4F8A"/></svg>',
  filtro:'<svg viewBox="0 0 200 100"><polygon points="60,30 140,30 100,70" fill="none" stroke="#1B4F8A" stroke-width="2" stroke-dasharray="4,2"/><line x1="30" y1="50" x2="60" y2="50" stroke="#1B4F8A" stroke-width="2"/><line x1="140" y1="50" x2="170" y2="50" stroke="#1B4F8A" stroke-width="2"/></svg>',
  regul:'<svg viewBox="0 0 200 100"><rect x="60" y="35" width="80" height="30" fill="none" stroke="#1B4F8A" stroke-width="2"/><line x1="100" y1="20" x2="100" y2="35" stroke="#1B4F8A" stroke-width="2"/><polygon points="95,20 105,20 100,12" fill="#1B4F8A"/><line x1="65" y1="50" x2="135" y2="50" stroke="#1B4F8A" stroke-width="2"/><polygon points="135,45 145,50 135,55" fill="#1B4F8A"/><line x1="30" y1="50" x2="60" y2="50" stroke="#1B4F8A" stroke-width="2"/><line x1="140" y1="50" x2="170" y2="50" stroke="#1B4F8A" stroke-width="2"/></svg>',
  manom:'<svg viewBox="0 0 200 100"><circle cx="100" cy="55" r="28" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><line x1="100" y1="55" x2="115" y2="42" stroke="#1B4F8A" stroke-width="2"/><circle cx="100" cy="55" r="2" fill="#1B4F8A"/><text x="100" y="60" font-family="Barlow Condensed" font-size="9" text-anchor="middle" fill="#1B4F8A">bar</text><line x1="100" y1="83" x2="100" y2="95" stroke="#1B4F8A" stroke-width="2"/></svg>',
  fuente:'<svg viewBox="0 0 200 100"><circle cx="100" cy="50" r="6" fill="#1B4F8A"/><line x1="106" y1="50" x2="160" y2="50" stroke="#1B4F8A" stroke-width="2"/><polygon points="160,46 170,50 160,54" fill="#1B4F8A"/></svg>',
  escape:'<svg viewBox="0 0 200 100"><line x1="30" y1="50" x2="80" y2="50" stroke="#1B4F8A" stroke-width="2"/><polygon points="80,42 100,50 80,58" fill="none" stroke="#1B4F8A" stroke-width="2"/></svg>'
};

var preguntas=Object.keys(componentes).map(function(k){return k;});
function shuffleArr(a){var b=a.slice();for(var k=b.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=b[k];b[k]=b[j];b[j]=t;}return b;}

var orden=shuffleArr(preguntas),i=0,aciertos=0,r=false;
var n=document.getElementById('num'),tot=document.getElementById('tot'),ac=document.getElementById('ac'),sym=document.getElementById('symbol'),op=document.getElementById('opts'),fb=document.getElementById('fb'),acc=document.getElementById('acciones'),sig=document.getElementById('siguiente'),card=document.getElementById('card'),resumen=document.getElementById('resumen');
tot.textContent=orden.length;document.getElementById('r-tot').textContent=orden.length;

function pintar(){
  var k=orden[i];n.textContent=i+1;sym.innerHTML=simbolos[k];
  fb.className='ic-fb';fb.innerHTML='';acc.style.display='none';r=false;op.innerHTML='';
  var resto=Object.keys(componentes).filter(function(x){return x!==k;});
  var dist=shuffleArr(resto).slice(0,3);
  shuffleArr(dist.concat([k])).forEach(function(x){
    var b=document.createElement('button');b.className='ic-opt';b.dataset.id=x;b.textContent=componentes[x].n;
    b.addEventListener('click',function(){if(r)return;r=true;var corr=orden[i];
      op.querySelectorAll('.ic-opt').forEach(function(bt){bt.disabled=true;if(bt.dataset.id===corr)bt.classList.add('ok');else if(bt===b)bt.classList.add('ko');});
      var c=componentes[corr];
      if(x===corr){aciertos++;fb.className='ic-fb show acierto';fb.innerHTML='<strong>✓ ¡Correcto!</strong> <strong>'+c.n+'</strong>: '+c.exp;}
      else{var elec=componentes[x];fb.className='ic-fb show fallo';fb.innerHTML='<strong>✗ Era '+c.n+'</strong>: '+c.exp+'<br><em>'+elec.n+'</em>: '+elec.exp;}
      ac.textContent=aciertos;acc.style.display='flex';
    });
    op.appendChild(b);
  });
}
sig.addEventListener('click',function(){i++;if(i>=orden.length){card.style.display='none';document.querySelector('.ic-progress').style.display='none';resumen.style.display='block';document.getElementById('r-ac').textContent=aciertos;var p=Math.round(aciertos/orden.length*100);document.getElementById('r-msg').innerHTML=(p>=80?'🌟 ¡Muy bien!':p>=60?'👍 Bien.':'📚 Repasa los símbolos.')+'<br><small>'+aciertos+' / '+orden.length+' ('+p+'%)</small>';resumen.scrollIntoView({behavior:'smooth'});}else pintar();});
document.getElementById('rein').addEventListener('click',function(){orden=shuffleArr(preguntas);i=0;aciertos=0;ac.textContent='0';resumen.style.display='none';card.style.display='block';document.querySelector('.ic-progress').style.display='flex';pintar();window.scrollTo({top:0,behavior:'smooth'});});
pintar();
})();
</script>
