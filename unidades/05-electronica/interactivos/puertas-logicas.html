<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B4F8A"><link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
<title>Simulador de puertas lógicas · U05 · Tecnología 4º ESO</title>
<meta name="description" content="Activa entradas y observa la salida en tiempo real. Las 6 puertas básicas con su tabla.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/common.css"><link rel="stylesheet" href="../../../assets/css/unidad.css">
<style>
.pl-wrap{max-width:900px;margin:30px auto;padding:0 20px 60px}
.pl-hero{text-align:center;margin-bottom:22px}
.pl-hero h1{font-family:var(--cond);font-size:2rem;color:var(--principal);margin:0 0 8px}
.pl-card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.pl-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pl-tab{font-family:var(--cond);background:#fff;border:1.5px solid var(--borde);padding:8px 14px;border-radius:18px;cursor:pointer;font-size:.9rem}
.pl-tab.activa{background:var(--principal);color:#fff;border-color:var(--principal)}
.pl-vis{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
@media(max-width:700px){.pl-vis{grid-template-columns:1fr}}
.pl-svg{background:#FAFBFC;border-radius:10px;padding:14px;display:flex;justify-content:center}
.pl-svg svg{width:100%;max-width:340px;height:auto}
.pl-controles{display:flex;flex-direction:column;gap:14px}
.pl-input{display:flex;align-items:center;gap:14px}
.pl-input .nombre{font-family:var(--cond);font-size:1.1rem;color:var(--principal);min-width:30px}
.pl-toggle{position:relative;width:60px;height:30px;background:#ddd;border-radius:15px;cursor:pointer;transition:background .15s}
.pl-toggle.on{background:#1E8E3E}
.pl-toggle::after{content:'';position:absolute;width:26px;height:26px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pl-toggle.on::after{left:32px}
.pl-input .val{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:var(--texto);font-weight:600}
.pl-salida{padding:14px 18px;background:var(--principal-cl);border-radius:8px;display:flex;align-items:center;gap:14px;font-family:var(--cond);font-size:1.1rem}
.pl-salida .led{width:30px;height:30px;border-radius:50%;background:#888;border:3px solid #555;transition:all .15s}
.pl-salida .led.on{background:radial-gradient(circle,#FFEE88,#FFB700);box-shadow:0 0 20px #FFD700;border-color:#FFA000}
.pl-info{margin-top:14px;padding:12px 16px;background:#E6F1FB;border-left:4px solid #378ADD;border-radius:0 6px 6px 0;font-size:.92rem;line-height:1.55}
.pl-tabla{display:inline-block;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:.95rem;margin-top:10px}
.pl-tabla th{background:var(--principal);color:#fff;padding:6px 14px}
.pl-tabla td{padding:6px 14px;text-align:center;border:1px solid var(--borde)}
.pl-tabla tr.active{background:#FFE680}
</style></head>
<body>
<header class="curso-hd"><span class="curso-sb">U05 · Electrónica · Puertas lógicas</span></header>
<nav class="curso-navcross" role="navigation">

</nav>

<main id="main-content" class="pl-wrap">
  <section class="pl-hero"><h1>⚡ Simulador de puertas lógicas</h1><p>Activa A y B y observa cómo cambia la salida F. La fila activa en la tabla resalta tu combinación actual.</p></section>

  <div class="pl-card">
    <div class="pl-tabs" id="tabs"></div>

    <div class="pl-vis">
      <div class="pl-svg" id="svg-cont"></div>
      <div class="pl-controles">
        <div class="pl-input"><span class="nombre">A</span><div class="pl-toggle" id="tg-A"></div><span class="val" id="v-A">0</span></div>
        <div class="pl-input" id="bin-input"><span class="nombre">B</span><div class="pl-toggle" id="tg-B"></div><span class="val" id="v-B">0</span></div>
        <div class="pl-salida"><span>F =</span><span class="val" id="v-F">0</span><div class="led" id="led"></div></div>
      </div>
    </div>

    <div class="pl-info">
      <strong id="g-nombre">AND</strong>: <span id="g-desc"></span>
      <div style="margin-top:10px"><strong>Tabla de verdad:</strong></div>
      <table class="pl-tabla" id="tabla"></table>
    </div>
  </div>
</main>

<script>
(function(){'use strict';
var gates={
  NOT:{n:'NOT (inversor)',desc:'Una entrada. Invierte: 0 se vuelve 1 y viceversa.',bin:false,fn:function(a){return a^1;}},
  AND:{n:'AND (Y)',desc:'Salida 1 solo si TODAS las entradas son 1.',bin:true,fn:function(a,b){return a&b;}},
  OR:{n:'OR (O)',desc:'Salida 1 si AL MENOS UNA entrada es 1.',bin:true,fn:function(a,b){return a|b;}},
  NAND:{n:'NAND',desc:'Inverso de AND. Salida 0 solo si TODAS son 1.',bin:true,fn:function(a,b){return (a&b)^1;}},
  NOR:{n:'NOR',desc:'Inverso de OR. Salida 1 solo si TODAS son 0.',bin:true,fn:function(a,b){return (a|b)^1;}},
  XOR:{n:'XOR (O exclusiva)',desc:'Salida 1 si las entradas son DIFERENTES.',bin:true,fn:function(a,b){return a^b;}}
};
var tabs=document.getElementById('tabs');
Object.keys(gates).forEach(function(k){
  var b=document.createElement('button');b.className='pl-tab'+(k==='AND'?' activa':'');b.dataset.g=k;b.textContent=k;
  b.addEventListener('click',function(){document.querySelectorAll('.pl-tab').forEach(function(t){t.classList.remove('activa');});b.classList.add('activa');gate=k;render();});
  tabs.appendChild(b);
});

var gate='AND',A=0,B=0;
var tA=document.getElementById('tg-A'),tB=document.getElementById('tg-B'),vA=document.getElementById('v-A'),vB=document.getElementById('v-B'),vF=document.getElementById('v-F'),led=document.getElementById('led'),binIn=document.getElementById('bin-input'),svgC=document.getElementById('svg-cont'),gNom=document.getElementById('g-nombre'),gDesc=document.getElementById('g-desc'),tabla=document.getElementById('tabla');

tA.addEventListener('click',function(){A^=1;render();});
tB.addEventListener('click',function(){B^=1;render();});

function svgPuerta(tipo){
  // Símbolos IEC simples
  if(tipo==='NOT')return '<svg viewBox="0 0 200 100"><line x1="20" y1="50" x2="60" y2="50" stroke="#1B4F8A" stroke-width="2"/><polygon points="60,30 60,70 110,50" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><circle cx="120" cy="50" r="6" fill="#fff" stroke="#1B4F8A" stroke-width="2"/><line x1="126" y1="50" x2="180" y2="50" stroke="#1B4F8A" stroke-width="2"/><text x="10" y="48" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">A</text><text x="180" y="48" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">F</text></svg>';
  if(tipo==='AND'||tipo==='NAND'){var inv=tipo==='NAND'?'<circle cx="135" cy="50" r="6" fill="#fff" stroke="#1B4F8A" stroke-width="2"/>':'';
    var ox=tipo==='NAND'?141:128;
    return '<svg viewBox="0 0 220 100"><line x1="20" y1="35" x2="60" y2="35" stroke="#1B4F8A" stroke-width="2"/><line x1="20" y1="65" x2="60" y2="65" stroke="#1B4F8A" stroke-width="2"/><path d="M60,20 L60,80 L100,80 A30,30 0 0,0 100,20 Z" fill="#fff" stroke="#1B4F8A" stroke-width="2"/>'+inv+'<line x1="'+ox+'" y1="50" x2="200" y2="50" stroke="#1B4F8A" stroke-width="2"/><text x="10" y="38" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">A</text><text x="10" y="68" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">B</text><text x="200" y="48" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">F</text></svg>';
  }
  if(tipo==='OR'||tipo==='NOR'||tipo==='XOR'){
    var inv=tipo==='NOR'?'<circle cx="135" cy="50" r="6" fill="#fff" stroke="#1B4F8A" stroke-width="2"/>':'';
    var extra=tipo==='XOR'?'<path d="M50,20 Q65,50 50,80" fill="none" stroke="#1B4F8A" stroke-width="2"/>':'';
    var ox=tipo==='NOR'?141:128;
    return '<svg viewBox="0 0 220 100">'+extra+'<line x1="20" y1="35" x2="65" y2="35" stroke="#1B4F8A" stroke-width="2"/><line x1="20" y1="65" x2="65" y2="65" stroke="#1B4F8A" stroke-width="2"/><path d="M60,20 Q90,20 110,50 Q90,80 60,80 Q75,50 60,20 Z" fill="#fff" stroke="#1B4F8A" stroke-width="2"/>'+inv+'<line x1="'+ox+'" y1="50" x2="200" y2="50" stroke="#1B4F8A" stroke-width="2"/><text x="10" y="38" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">A</text><text x="10" y="68" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">B</text><text x="200" y="48" font-family="Barlow Condensed" font-size="14" fill="#1B4F8A">F</text></svg>';
  }
  return '';
}

function render(){
  var g=gates[gate];
  binIn.style.display=g.bin?'flex':'none';
  if(!g.bin){B=0;}
  tA.classList.toggle('on',A===1);tB.classList.toggle('on',B===1);
  vA.textContent=A;vB.textContent=B;
  var F=g.bin?g.fn(A,B):g.fn(A);
  vF.textContent=F;led.classList.toggle('on',F===1);
  svgC.innerHTML=svgPuerta(gate);
  gNom.textContent=g.n;gDesc.textContent=g.desc;
  // Tabla
  var html='';
  if(!g.bin){
    html='<thead><tr><th>A</th><th>F</th></tr></thead><tbody>';
    [0,1].forEach(function(a){var fila=(a===A?' class="active"':'');html+='<tr'+fila+'><td>'+a+'</td><td>'+g.fn(a)+'</td></tr>';});
    html+='</tbody>';
  } else {
    html='<thead><tr><th>A</th><th>B</th><th>F</th></tr></thead><tbody>';
    [[0,0],[0,1],[1,0],[1,1]].forEach(function(c){var fila=(c[0]===A&&c[1]===B?' class="active"':'');html+='<tr'+fila+'><td>'+c[0]+'</td><td>'+c[1]+'</td><td>'+g.fn(c[0],c[1])+'</td></tr>';});
    html+='</tbody>';
  }
  tabla.innerHTML=html;
}
render();
})();
</script>
<script data-goatcounter="https://malonso72.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
