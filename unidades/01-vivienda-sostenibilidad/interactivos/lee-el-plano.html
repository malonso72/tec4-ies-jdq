      var chk = function () {
        var v = parseFloat(inp.value.replace(',', '.'));
        if (isNaN(v)) return;
        var tol = r.tol || Math.max(0.005, Math.abs(r.ok) * 0.005);
        if (Math.abs(v - r.ok) <= tol) fb('ok', '✔ Correcto. ' + r.sol); else fb('ko', '✘ No es correcto. Revisa las cotas y vuelve a intentarlo.');
      };
      document.getElementById('comprobar').onclick = chk;
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') chk(); });
    }
    if (r.tipo === 'opc') panel.querySelectorAll('.op').forEach(function (b) {
      b.onclick = function () { if (b.getAttribute('data-o') === r.ok) fb('ok', '✔ Correcto. ' + r.sol); else fb('ko', '✘ No es correcto. Fíjate en qué fachada está.'); };
    });
  }
  function fb(cls, txt) { var f = document.getElementById('fb'); f.className = 'lp-fb ' + cls; f.textContent = txt; }
  function marcaSol(r) {
    if (r.tipo !== 'clic') return;
    limpiaSel();
    r.ok.forEach(function (id) { var n = svg.querySelector('[data-id="' + id + '"]'); if (n) n.classList.add(n.getAttribute('data-tipo') === 'estancia' ? 'ok-zona' : 'sel'); });
  }
  function respuestaClic(id, t) {
    var r = RETOS[ir]; if (r.tipo !== 'clic') return;
    if (r.ok.indexOf(id) >= 0) { if (t.getAttribute('data-tipo') === 'estancia') { t.classList.remove('sel'); t.classList.add('ok-zona'); } fb('ok', '✔ Correcto. ' + r.sol); }
    else fb('ko', '✘ Eso no es. Inténtalo otra vez.');
  }

  /* ---------- modos ---------- */
  document.querySelectorAll('.lp-tab').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.lp-tab').forEach(function (x) { x.classList.toggle('activa', x === b); });
      modo = b.getAttribute('data-modo'); limpiaSel(); med = []; dibujaMed();
      svg.classList.toggle('medir', modo === 'medir');
      if (modo === 'explorar') panelExplorar(); else if (modo === 'medir') panelMedir(); else panelRetos();
    });
  });
  panelExplorar();
})();
</script>
